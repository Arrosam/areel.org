<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Language stub.

  The landing page lives under /en and /zh, matching /fishball and /hydrogen.
  A Chinese-language browser goes to /zh, everything else to /en, keeping any
  fragment (#works, #dsh-fishball, #dsh-plugins). Without script the meta
  refresh takes them to English, and the line below offers both.
-->
<meta http-equiv="refresh" content="1; url=en/">
<meta name="description" content="areel.org — open source works by W.L. (@Arrosam). Home of Hydrogen, FishBall, DSH-Fishball, and DeepSeek Harness plugins.">
<meta name="theme-color" content="#c9c9c5">
<meta property="og:title" content="AREEL — open source works">
<meta property="og:description" content="Open source works by W.L. (@Arrosam). Hydrogen, FishBall, DSH-Fishball, and DeepSeek Harness plugins.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://areel.org">
<link rel="canonical" href="https://areel.org/en/">
<link rel="alternate" hreflang="en" href="https://areel.org/en/">
<link rel="alternate" hreflang="zh" href="https://areel.org/zh/">
<link rel="alternate" hreflang="x-default" href="https://areel.org/">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<title>AREEL — open source works</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#c9c9c5;color:#101010;
       font-family:"JetBrains Mono",ui-monospace,"PingFang SC","Microsoft YaHei",monospace;
       font-size:.6875rem;letter-spacing:.14em;text-transform:uppercase}
  a{color:#ec0a6e}
</style>
</head>
<body>
  <p>AREEL — <a href="zh/">中文</a> · <a href="en/">English</a></p>
  <script>location.replace((/^zh\b/i.test(navigator.language || '') ? 'zh/' : 'en/') + (location.hash || ''));</script>
</body>
</html>
