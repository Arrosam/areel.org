<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  Language stub.

  The page lives under /en and /zh. This exists so that areel.org/fishball resolves rather
  than 404s, and sends the browser to whichever it reads: a Chinese-language browser goes to
  /zh, everything else to /en. Redirect rather than a copy: two files with the same content
  is one file that will go stale. Without script the meta refresh takes them to English, and
  the line below offers both.
-->
<meta http-equiv="refresh" content="1; url=en/">
<link rel="canonical" href="https://areel.org/fishball/en/">
<link rel="alternate" hreflang="en" href="https://areel.org/fishball/en/">
<link rel="alternate" hreflang="zh" href="https://areel.org/fishball/zh/">
<title>FishBall</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#c9c9c5;color:#101010;
       font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.6875rem;letter-spacing:.14em;
       text-transform:uppercase}
  a{color:#ec0a6e}
</style>
</head>
<body>
  <p>FishBall — <a href="zh/">中文</a> · <a href="en/">English</a></p>
  <script>location.replace(/^zh\b/i.test(navigator.language || '') ? 'zh/' : 'en/');</script>
</body>
</html>
